<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обща дъска</title>
<style>
:root{--bg:#1d2a33;--panel:#263641;--ink:#f1ece0;--muted:#9fb0ba;--accent:#f2b84b;--paper:#fbf8f1;--line:#3a4d5a}
@media (prefers-color-scheme: light){:root{--bg:#e8e2d4;--panel:#f6f1e4;--ink:#1d2a33;--muted:#5b6b75;--accent:#c47f00;--line:#cfc6b2}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.55em 1em;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d2a33;font-weight:bold}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#lobby{margin:auto;max-width:26rem;padding:1.5rem;display:grid;gap:1rem}
#lobby h1{font-size:2.4rem;margin:0;letter-spacing:-.02em}
#lobby p{margin:0;color:var(--muted)}
.row{display:flex;gap:.5rem}
#code{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.55em .8em;text-transform:uppercase;letter-spacing:.3em;text-align:center}
#err{color:#e8806b;min-height:1.4em}
#board{display:none;flex:1;min-height:0;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.6rem .8rem;background:var(--panel);border-bottom:1px solid var(--line)}
header .info{margin-right:auto;color:var(--muted)}
header b{color:var(--ink);letter-spacing:.2em}
input[type=color]{width:2.4rem;height:2.2rem;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{width:6rem;accent-color:var(--accent)}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:.8rem}
canvas{background:var(--paper);border-radius:4px;box-shadow:0 2px 0 var(--line);touch-action:none;cursor:crosshair;max-width:100%;max-height:100%;aspect-ratio:3/2;width:auto;height:auto}
</style>
</head>
<body>

<main id="lobby">
  <h1>Обща дъска</h1>
  <p>Рисувайте заедно от различни устройства. Един създава стая, останалите влизат с код.</p>
  <button class="primary" id="create">Създай стая</button>
  <div class="row">
    <input id="code" maxlength="4" placeholder="КОД" aria-label="Код на стаята" autocomplete="off">
    <button id="join">Влез</button>
  </div>
  <div id="err" role="status"></div>
</main>

<section id="board">
  <header>
    <span class="info">Стая <b id="room"></b> · <span id="count">1</span> на линия</span>
    <input type="color" id="color" value="#d1495b" aria-label="Цвят">
    <input type="range" id="size" min="2" max="24" value="5" aria-label="Дебелина">
    <button id="share">Копирай линк</button>
    <button id="clear">Изчисти</button>
  </header>
  <div id="wrap"><canvas id="cv" width="1200" height="800"></canvas></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'wd-board-';
const cv = $('cv'), ctx = cv.getContext('2d');
ctx.lineCap = ctx.lineJoin = 'round';

let peer, isHost = false, code = '';
let hostConn = null;          // за гост: връзката към домакина
const conns = [];             // за домакин: връзките към гостите
const history = [];           // за домакин: всички щрихи

function showBoard(c){
  code = c;
  $('lobby').style.display = 'none';
  $('board').style.display = 'flex';
  $('room').textContent = c;
  location.hash = c;
}
function fail(msg){ $('err').textContent = msg; }

// ---------- рисуване ----------
function drawSeg(s){
  ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
  ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
}
function clearAll(){ ctx.clearRect(0, 0, cv.width, cv.height); }

// ---------- мрежа ----------
function broadcast(msg, except){
  conns.forEach(c => { if (c !== except && c.open) c.send(msg); });
}
function emit(msg){                 // локално действие -> към другите
  if (isHost){ broadcast(msg); } else if (hostConn && hostConn.open){ hostConn.send(msg); }
}
function apply(msg){
  if (msg.t === 's'){ drawSeg(msg); if (isHost) history.push(msg); }
  else if (msg.t === 'clear'){ clearAll(); if (isHost) history.length = 0; }
  else if (msg.t === 'hist'){ msg.d.forEach(drawSeg); }
  else if (msg.t === 'n'){ $('count').textContent = msg.n; }
}
function updateCount(){
  const n = conns.length + 1;
  $('count').textContent = n;
  broadcast({t:'n', n});
}

function startHost(attempt = 0){
  isHost = true;
  const c = Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  peer = new Peer(PREFIX + c);
  peer.on('open', () => showBoard(c));
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && attempt < 5){ peer.destroy(); startHost(attempt + 1); }
    else fail('Грешка при създаване на стая: ' + e.type);
  });
  peer.on('connection', conn => {
    conn.on('open', () => {
      conns.push(conn);
      conn.send({t:'hist', d: history});
      updateCount();
    });
    conn.on('data', m => { apply(m); broadcast(m, conn); });
    conn.on('close', () => { const i = conns.indexOf(conn); if (i >= 0) conns.splice(i, 1); updateCount(); });
  });
}

function startGuest(c){
  isHost = false;
  peer = new Peer();
  peer.on('open', () => {
    hostConn = peer.connect(PREFIX + c, {reliable:true});
    hostConn.on('open', () => showBoard(c));
    hostConn.on('data', apply);
    hostConn.on('close', () => { alert('Връзката със стаята е прекъсната.'); location.hash = ''; location.reload(); });
  });
  peer.on('error', e => {
    fail(e.type === 'peer-unavailable' ? 'Няма стая с този код.' : 'Грешка при връзка: ' + e.type);
  });
}

// ---------- интерфейс ----------
$('create').onclick = () => { $('err').textContent = ''; startHost(); };
$('join').onclick = () => {
  const c = $('code').value.trim().toUpperCase();
  if (c.length !== 4) return fail('Кодът е 4 букви.');
  $('err').textContent = ''; startGuest(c);
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('join').click(); });
$('clear').onclick = () => { clearAll(); if (isHost) history.length = 0; emit({t:'clear'}); };
$('share').onclick = async () => {
  const url = location.origin + location.pathname + '#' + code;
  try { await navigator.clipboard.writeText(url); $('share').textContent = 'Копирано'; }
  catch { prompt('Копирайте линка:', url); }
  setTimeout(() => $('share').textContent = 'Копирай линк', 1500);
};

let last = null;
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); last = pos(e); stroke(last, last); });
cv.addEventListener('pointermove', e => { if (last){ const p = pos(e); stroke(last, p); last = p; } });
['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, () => last = null));
function stroke(a, b){
  const s = {t:'s', x0:a.x, y0:a.y, x1:b.x, y1:b.y, c:$('color').value, w:+$('size').value};
  apply(s); emit(s);
}

// влизане директно от линк с #КОД
const h = location.hash.slice(1).toUpperCase();
if (h.length === 4){ $('code').value = h; startGuest(h); }
</script>
</body>
</html>
